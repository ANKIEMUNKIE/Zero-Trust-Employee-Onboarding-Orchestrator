server:
  port: 8080

spring:
  application:
    name: zero-trust-onboarding-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:onboardingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driverClassName: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

camunda:
  client:
    zeebe:
      enabled: ${ZEEBE_ENABLED:false}
      gateway-address: ${ZEEBE_GATEWAY_ADDRESS:127.0.0.1:26500}
      security:
        plaintext: true